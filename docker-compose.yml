services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    networks:
      - music_room_network
    depends_on:
      - backend
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: music-room-backend
    volumes:
      - ./backend/src:/app/src:z # hot-reload en dev
      - ./backend/prisma:/app/prisma:z # migrations live
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - music_room_network

  adminer:
    image: adminer
    restart: always
    ports:
      - 1919:8080
    networks:
      - music_room_network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - music_room_network

  spoti-scraper:
    build:
      context: ./spoti-scraper
      dockerfile: Dockerfile
    volumes:
      - ./spoti-scraper:/app:z
    networks:
      - music_room_network
    ports:
      - "4242:4242"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  dbVisualiser:
    image: music-room-backend
    container_name: db_visualiser
    command:
      [
        "npx",
        "prisma",
        "studio",
        "--port",
        "5555",
        "--browser",
        "none"
      ]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/prisma:/app/prisma:z
    profiles:
      - visual
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - music_room_network

volumes:
  pg_data:

networks:
  music_room_network:
    driver: bridge
