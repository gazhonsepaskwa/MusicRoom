services:
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "${EXTERNAL_PORT}:${CADDY_INTERNAL_PORT}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:z
      # SSL certs (auto-generated by Caddy)
      - caddy_data:/data:z
      - caddy_config:/config:z
    depends_on:
      - backend
    networks:
      - music_room_network
    env_file:
      - .env

  backend:
    security_opt:
      - label=disable
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: music-room-backend
    volumes:
      - ./backend/src:/app/src:z
      - ./backend/prisma:/app/prisma:z
      - ./dl:/dl:z

    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - music_room_network
    secrets:
      - smtp_password
      - jwt_secret
      - database_url
      - oauth_client_id_wa
      - firebase_service_account.json

  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - music_room_network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data:z
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - music_room_network
    secrets:
      - db_password

  spoti-scraper:
    build:
      context: ./spoti-scraper
      dockerfile: Dockerfile
    volumes:
      - ./spoti-scraper:/app:z
      - ./dl:/dl:z
    networks:
      - music_room_network
    ports:
      - "8031:4242"
    env_file:
      - .env
    secrets:
      - db_password
      - google_youtube_credentials
      - spotify_user_id
      - spotify_user_secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  music_room_network:
    driver: bridge

secrets:
  google_youtube_credentials:
    file: secrets/google_service_account.json
  smtp_password:
    file: secrets/smtp_password
  jwt_secret:
    file: secrets/jwt_secret
  database_url:
    file: secrets/database_url
  db_password:
    file: secrets/db_password
  oauth_client_id_wa:
    file: secrets/oauth_webapp.json
  spotify_user_id:
    file: secrets/spotify_user_id
  spotify_user_secret:
    file: secrets/spotify_user_secret
  firebase_service_account.json:
    file: secrets/firebase-service-account.json
