services:
  db:
    image: postgres:15-alpine
    container_name: music_room_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - music_room_network
  backend:
    image: node:18-alpine
    working_dir: /app
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music_room_backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NODE_ENV: development
    volumes:
      - ./backend:/app
      # - /app/node_modules
    ports:
      - "${BACKEND_PORT}:3000"
    networks:
      - music_room_network
    command: npm install && npm run start:dev

volumes:
  postgres_data:

networks:
  music_room_network:
    driver: bridge
