services:
  avahi:
    image: flungo/avahi
    container_name: musicroom-avahi
    restart: always
    network_mode: host
    environment:
      # Set the hostname that will be advertised on the local network
      - SERVER_HOST_NAME=musicroom
      # Enable DNS-SD publishing
      - PUBLISH_PUBLISH_DOMAIN=yes
      # Enable workstation publishing (includes host info)
      - PUBLISH_PUBLISH_WORKSTATION=yes
      # Allow mDNS traffic on the network
      - SERVER_USE_IPV4=yes
      - SERVER_USE_IPV6=yes

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "${EXTERNAL_PORT}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      # SSL certs (auto-generated by Caddy)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - music_room_network

  backend:
    security_opt:
      - label=disable
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: music-room-backend
    volumes:
      - ./backend/src:/app/src:z # hot-reload en dev
      - ./backend/prisma:/app/prisma:z # migrations live
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - music_room_network
    secrets:
      - smtp_password
      - jwt_secret
      - database_url
      - oauth_client_id_wa

  adminer:
    image: adminer
    restart: always
    ports:
      - 1919:8080
    networks:
      - music_room_network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - music_room_network
    secrets:
      - db_password

  spoti-scraper:
    build:
      context: ./spoti-scraper
      dockerfile: Dockerfile
    volumes:
      - ./spoti-scraper:/app:z
      - ./dl:/dl:z
    networks:
      - music_room_network
    ports:
      - "4242:4242"
    env_file:
      - .env
    secrets:
      - db_password
      - google_youtube_credentials
      - spotify_user_id
      - spotify_user_secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  music_room_network:
    driver: bridge

secrets:
  google_youtube_credentials:
    file: secrets/google_service_account.json
  smtp_password:
    file: secrets/smtp_password
  jwt_secret:
    file: secrets/jwt_secret
  database_url:
    file: secrets/database_url
  db_password:
    file: secrets/db_password
  oauth_client_id_wa:
    file: secrets/oauth_webapp.json
  spotify_user_id:
    file: secrets/spotify_user_id
  spotify_user_secret:
    file: secrets/spotify_user_secret
