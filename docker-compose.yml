services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    networks:
      - music_room_network
    depends_on:
      - backend
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
  db:
    image: postgres:15-alpine
    container_name: music_room_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - music_room_network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music_room_backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NODE_ENV: development
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    networks:
      - music_room_network
    # command: npm run dev

volumes:
  postgres_data:

networks:
  music_room_network:
    driver: bridge
